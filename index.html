<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Verdulería">
<meta name="theme-color" content="#1b5e20"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" id="ati" href="icon.svg">
<title>Mi Verdulería</title>
<style>
:root{--g:#1b5e20;--g2:#2e7d32;--r:#c62828;--o:#e65100}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:20px/1.35 -apple-system,Helvetica,Arial,sans-serif;background:#f1f5ee;color:#101010;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header b{font-size:23px;flex:1}header button{background:#ffffff33;color:#fff;border:0;border-radius:12px;font-size:19px;padding:10px 12px;font-weight:700}
main{padding:14px;max-width:600px;margin:auto}
.c{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;border:2px solid #d5dccf}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--g2);color:#fff;font-size:23px;font-weight:700;padding:18px;margin-bottom:12px;text-align:center;text-decoration:none}
.btn.r{background:var(--r)}.btn.o{background:var(--o)}.btn.w{background:#fff;color:var(--g);border:3px solid var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.grid .btn{margin:0;padding:24px 6px;font-size:22px}.grid .full{grid-column:1/-1}
label{font-weight:700;display:block}
input,select{width:100%;font-size:24px;padding:13px;border:2px solid #555;border-radius:12px;margin:6px 0 12px;background:#fff}
input[type=checkbox]{width:30px;height:30px;margin:0 10px 0 0;vertical-align:middle}
.big{font-size:40px;font-weight:800}.bad{color:var(--r);font-weight:700}.ok{color:var(--g2)}small{color:#444}h3{margin:16px 0 8px}
.qr{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.qr button{width:76px;height:60px;font-size:34px;border:0;border-radius:14px;background:var(--g2);color:#fff}.qr button:first-child{background:var(--r)}
.qr span{font-size:30px;font-weight:800;min-width:100px;text-align:center;border-bottom:3px dashed #777}
.bar{position:sticky;bottom:0;background:#fff;margin:0 -14px;padding:10px 14px 2px;border-top:3px solid var(--g);font-size:26px}
.x{background:none;border:0;font-size:22px;color:var(--r)}summary{padding:4px 0}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;color:#fff;padding:14px 22px;border-radius:30px;font-size:21px;display:none;z-index:9}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee}.tot{font-weight:800;font-size:24px}
</style></head><body>
<header><button id="bk" onclick="back()" hidden>← Volver</button><b id="t"></b><small id="sy" style="font-size:14px"></small></header>
<main id="m"></main><div id="ts"></div>
<script>
const K='verdu1',U=['kg','unidad','cabeza','atado','mazo','docena','bolsa','caja','cajón','otro'],$=s=>document.querySelector(s);
let db=loadDB(),CT={},CB={},BG=null,CV=null,ST='ok',PI;
function seedProducts(){return[['Tomate Santa Cruz',5000,'🍅'],['Papa',6000,'🥔'],['Cebolla',6000,'🧅'],['Zanahoria',3500,'🥕'],['Locote verde',7000,'🫑'],['Ajo',12000,'🧄'],['Queso Paraguay',35000,'🧀']].map((p,i)=>({id:'p'+i,name:p[0],unit:'kg',cost:p[1],mk:40,price:Math.round(p[1]*1.4/500)*500,min:3,e:p[2]}))}
function recost(p){const L=db.moves.filter(m=>m.pid==p.id).sort((a,b)=>a.t-b.t);let s=0,c=null;L.forEach(m=>{if(m.k=='compra'){const s0=Math.max(s,0);c=(s0*(c??m.cost)+m.q*m.cost)/(s0+m.q)}s+=m.q});if(c!==null)p.cost=c}
function reprice(){db.products.sort(srt);db.products.forEach(p=>{p.mk=mkOf(p);p.price=rnd(p.cost*(1+p.mk/100))});db.combos.forEach(c=>{const k=ccost(c);c.mk=mkOf(c,k);c.price=rnd(k*(1+c.mk/100))})}
function loadDB(){const d={products:[],combos:[],moves:[],sales:[],exp:[],biz:{name:'Mi Verdulería',wa:'',mk:40,round:500}};
try{const o=JSON.parse(localStorage.getItem(K));if(o&&o.products){Object.assign(d,o);d.products.sort((a,b)=>a.name.localeCompare(b.name,'es'));return d}}catch(e){}
d.products=seedProducts();return d}
const srt=(a,b)=>a.name.localeCompare(b.name,'es');
function localStore(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('No hay espacio para guardar. Exportá tus datos y sacá fotos más chicas.')}}
function save(){localStore();window.cloudSave&&cloudSave()}
const loginHTML=()=>`<div class=c><label>Email</label><input id=le type=email autocapitalize=off><label>Contraseña</label><input id=lp type=password></div><button class=btn onclick="doLogin()">INGRESAR</button><div id=lerr class=bad></div>`;
const id=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),P=i=>db.products.find(p=>p.id==i),C=i=>db.combos.find(c=>c.id==i);
const g=n=>'Gs. '+String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'),q=n=>String(Math.round(n*100)/100).replace('.',',');
const num=s=>parseFloat(String(s).replace(',','.'))||0,mon=s=>+String(s).replace(/[.\s]/g,'').replace(',','.')||0;
const day=t=>new Date(t).toLocaleDateString('en-CA'),T=()=>day(Date.now()),dmy=s=>s.split('-').reverse().join('/');
const hm=t=>new Date(t).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st=p=>db.moves.filter(m=>m.pid==p).reduce((a,m)=>a+m.q,0),low=p=>st(p.id)<=p.min;
const ccost=c=>c.items.reduce((a,i)=>a+i.q*(P(i.pid)||{cost:0}).cost,0),pct=p=>p.cost?q((p.price-p.cost)/p.cost*100):'0',rnd=v=>{const r=db.biz.round||500;return v>0?Math.max(r,Math.round(v/r)*r):0},mkOf=(o,c=o.cost)=>o.mk!=null?o.mk:(c&&o.price>0?Math.round((o.price-c)/c*100):(db.biz.mk??40)),fx=(p,bu)=>bu==p.unit?1:(p.bu==bu&&p.f?p.f:(bu=='docena'&&['unidad','cabeza','atado','mazo'].includes(p.unit)?12:'')),newCost=(p,n,t)=>{const s=Math.max(st(p.id),0);return(s*p.cost+t)/(s+n)};
const ok=N=>Object.keys(N).every(i=>st(i)>=N[i])||confirm('Hay menos stock del anotado. ¿Seguir igual?');
function toast(s){const t=$('#ts');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1600)}
function sum(per){const t=T(),m=x=>per=='hoy'?day(x)==t:day(x).slice(0,7)==t.slice(0,7),S=db.sales.filter(s=>m(s.t)),
v=S.reduce((a,s)=>a+s.total,0),c=S.reduce((a,s)=>a+s.cost,0),e=db.exp.filter(x=>m(x.d)).reduce((a,x)=>a+x.a,0),
lo=db.moves.filter(x=>x.k=='perdida'&&m(x.t)).reduce((a,x)=>a-x.q*x.cost,0);return{v,c,gb:v-c,e,net:v-c-e,lo}}
function mkSale(L){const sid=id(),t=Date.now();let tot=0,cost=0,items=[];
L.forEach(l=>{const[k,i]=l.key.split(':');if(k=='p'){const p=P(i);tot+=p.price*l.q;cost+=p.cost*l.q;items.push({n:p.name,q:l.q,u:p.unit,v:p.price*l.q});db.moves.push({id:id(),pid:i,q:-l.q,k:'venta',cost:p.cost,t,sid})}
else{const c=C(i);tot+=c.price*l.q;cost+=ccost(c)*l.q;items.push({n:c.name,q:l.q,u:'combo',v:c.price*l.q});c.items.forEach(x=>db.moves.push({id:id(),pid:x.pid,q:-x.q*l.q,k:'venta',cost:P(x.pid).cost,t,sid}))}});
db.sales.push({id:sid,t,items,total:tot,cost});save()}
const S=[{v:'home',a:{}}];
function go(v,a){if(v=='edit')PI=undefined;S.push({v,a:a||{}});draw();scrollTo(0,0)}
function back(){if(S.length>1)S.pop();draw()}
function draw(){const s=S[S.length-1];let r;try{r=VW[s.v](s.a)}catch(e){console.error(e);if(S.length>1){S.length=1;return draw()}r=['Error','<div class=c>Hubo un problema. Cerrá y abrí la app.</div>']}$('#t').textContent=r[0];$('#m').innerHTML=r[1];$('#bk').hidden=S.length<2;if($('#gn'))upd()}
const VW={
home:()=>{const r=sum('hoy');return['🥬 '+db.biz.name,`<div class=c onclick="go('res')"><div>Stock bajo: <b class="${db.products.filter(low).length?'bad':''}">${db.products.filter(low).length} productos</b></div><div>Ventas de hoy: <b>${g(r.v)}</b></div><div>Ganancia de hoy: <b class=ok>${g(r.net)}</b></div><small>Tocá para ver el resumen</small></div>
<div class=grid><button class=btn onclick="go('stock')">📦<br>STOCK</button><button class=btn onclick="go('prec')">💰<br>PRECIOS</button><button class=btn onclick="go('vta')">🧾<br>VENTAS</button><button class=btn onclick="go('gas')">💸<br>GASTOS</button><button class="btn o full" onclick="go('pub')">📱 PUBLICAR</button></div>
<button class="btn w" style="font-size:18px;padding:12px" onclick="go('cfg')">⚙️ Mi negocio y copia de seguridad</button>`]},
stock:()=>['📦 Stock',db.products.map(p=>{const s=st(p.id);return`<div class=c onclick="go('prod',{id:'${p.id}'})" style="border-left:12px solid ${low(p)?'var(--r)':'var(--g2)'}"><b>${th(p)}${esc(p.name)}</b><br><span class=big style="font-size:30px">${q(s)} ${p.unit}</span> ${low(p)?'<span class=bad>⚠️ Poco</span>':''}</div>`}).join('')],
prod:a=>{const p=P(a.id),m=db.moves.filter(x=>x.pid==p.id).sort((a,b)=>b.t-a.t),G={},L=x=>x.k=='compra'?'Compra':x.k=='venta'?'Venta':x.why;
m.forEach(x=>G[L(x)]=(G[L(x)]||0)+x.q);
return[p.name,`<div class=c>Stock actual<div class=big>${q(st(p.id))} ${p.unit}</div></div>
<button class=btn onclick="go('mov',{id:'${p.id}',k:'compra'})">➕ ENTRADA</button><button class="btn o" onclick="go('mov',{id:'${p.id}',k:'venta'})">🧾 SALIDA (venta)</button><button class="btn r" onclick="go('mov',{id:'${p.id}',k:'perdida'})">⚠️ PÉRDIDA</button>
<div class=c><b>Resumen</b>${Object.keys(G).map(l=>`<div class=row><span>${l}</span><b>${G[l]>0?'+':''}${q(G[l])} ${p.unit}</b></div>`).join('')||'<div>Sin movimientos</div>'}</div>
<div class=c><b>Movimientos</b> <small>(tocá uno para corregirlo)</small>${m.slice(0,40).map(x=>`<div class=row onclick="go('mvd',{id:'${x.id}'})"><span>${x.q>0?'+':''}${q(x.q)} ${p.unit} — ${L(x)}${x.bq&&x.bu!=p.unit?' ('+q(x.bq)+' '+x.bu+')':''}</span><small>${dmy(day(x.t))} ›</small></div>`).join('')}</div>`]},
mov:a=>{const p=P(a.id),k=a.k,bu=p.bu||p.unit;return[{compra:'➕ Entrada',venta:'🧾 Salida',perdida:'⚠️ Pérdida'}[k]+' — '+p.name,`<div class=c>
${k=='compra'?`<label>Compré en</label><select id=bu onchange="mvu()">${[bu,...U.filter(u=>u!=bu)].map(u=>`<option ${u==bu?'selected':''}>${u}`).join('')}</select>`:''}
<label id=lq>¿Cuántos ${k=='compra'?bu:p.unit}?</label><input id=q inputmode=decimal placeholder="0" oninput="cp()">
${k=='compra'?`<div id=fr style="display:${bu==p.unit?'none':'block'}"><label id=lf>¿Cuántos ${p.unit} trae cada ${bu}?</label><input id=f inputmode=decimal value="${fx(p,bu)}" oninput="cp()"></div><label>Costo total pagado (Gs.)</label><input id=c inputmode=numeric placeholder="100000" oninput="cp()"><div id=cp class=ok style="font-weight:700"></div>`:''}
${k=='perdida'?'<label>Motivo</label><select id=w><option>Consumo familiar<option>Merma<option>Producto dañado<option>Regalo<option>Otro</select>':''}
${k=='venta'?`<div>Se vende a <b>${g(p.price)}</b> por ${p.unit}</div>`:''}</div><button class=btn onclick="doMov('${p.id}','${k}')">GUARDAR</button>`]},
mvd:a=>{const m=db.moves.find(x=>x.id==a.id);if(!m)throw 0;const p=P(m.pid),L=m.k=='compra'?'Compra':m.k=='venta'?'Venta':m.why,
head=`<div class=c><b>${esc(p.name)}</b><br>${dmy(day(m.t))} ${hm(m.t)}<br><span class=big style="font-size:30px">${m.q>0?'+':''}${q(m.q)} ${p.unit}</span> — ${L}</div>`;
if(m.k=='venta')return['Movimiento',head+`<div class=c>Este movimiento es parte de una venta. Para corregirlo, anulá la venta.</div><button class=btn onclick="go('hv')">📋 Ir a ventas anteriores</button>`];
return['Corregir movimiento',head+`<div class=c><label>Cantidad (${p.unit})</label><input id=q inputmode=decimal value="${Math.abs(m.q)}">${m.k=='compra'?`<label>Costo total pagado (Gs.)</label><input id=c inputmode=numeric value="${Math.round(m.cost*m.q)}">`:`<label>Motivo</label><select id=w>${['Consumo familiar','Merma','Producto dañado','Regalo','Otro'].map(o=>`<option ${o==m.why?'selected':''}>${o}`).join('')}</select>`}</div><button class=btn onclick="doMvEdit('${m.id}')">GUARDAR CAMBIOS</button><button class="btn r" onclick="delMove('${m.id}')">🗑️ BORRAR ESTE MOVIMIENTO</button>`]},
prec:()=>['💰 Precios',db.products.map(p=>`<div class=c onclick="go('edit',{id:'${p.id}'})"><b>${th(p)}${esc(p.name)}</b> <small>por ${p.unit}</small><div class=row><span>Costo</span><b>${g(p.cost)}</b></div><div class=row><span>Precio</span><b>${g(p.price)}</b></div><div class=row><span>Ganancia</span><b class=ok>${g(p.price-p.cost)} (${pct(p)}%)</b></div></div>`).join('')+`<button class=btn onclick="go('edit',{id:''})">➕ Producto nuevo</button><h3>🧺 Combos</h3>`+db.combos.map(c=>`<div class=c onclick="ce('${c.id}')"><b>${th(c)}${esc(c.name)}</b><div class=row><span>Costo</span><b>${g(ccost(c))}</b></div><div class=row><span>Precio</span><b>${g(c.price)}</b></div><div class=row><span>Ganancia</span><b class=ok>${g(c.price-ccost(c))}</b></div></div>`).join('')+`<button class="btn w" onclick="ce('')">➕ Combo nuevo</button>`],
edit:a=>{const p=a.id?P(a.id):{name:'',unit:'kg',cost:0,price:0,min:3,img:'',mk:db.biz.mk??40};return[a.id?'Editar producto':'Producto nuevo',`<div class=c><label>Nombre</label><input id=n value="${esc(p.name)}"><label>Foto del producto</label><input type=file accept="image/*" onchange="pickP(this)"><div id=pv>${p.img?`<img src="${p.img}" style="width:120px;border-radius:10px">`:''}</div><button class="btn w" style="font-size:17px;padding:10px" onclick="PI='';$('#pv').innerHTML=''">Quitar foto</button><label>Se vende por</label><select id=u>${U.map(u=>`<option ${u==p.unit?'selected':''}>${u}`).join('')}</select>
<label>Costo por ${p.unit} (Gs.)</label><input id=c inputmode=numeric value="${Math.round(p.cost)||''}" oninput="upd()"><small>Se actualiza solo cuando anotás una Entrada.</small><label style="margin-top:10px">Ganancia % (sobre el costo)</label><input id=k inputmode=decimal value="${mkOf(p)}" oninput="upd()"><div class="big ok" id=gn style="font-size:26px"></div>
<label>Avisar cuando quede menos de</label><input id=m inputmode=decimal value="${p.min}"></div><button class=btn onclick="doEdit('${a.id}')">GUARDAR</button>${a.id?`<button class="btn r" onclick="delP('${a.id}')">Eliminar producto</button>`:''}`]},
cedit:()=>{const c=ccost(CB),k=CB.mk??db.biz.mk??40,pr=rnd(c*(1+k/100));return[CB.id?'Combo':'Combo nuevo',`<div class=c><label>Nombre</label><input value="${esc(CB.name)}" onchange="CB.name=this.value"><label>Ganancia % (sobre el costo)</label><input inputmode=decimal value="${k}" onchange="CB.mk=num(this.value);draw()">
<label>Foto del combo</label><input type=file accept="image/*" onchange="pickC(this)">${CB.img?`<img src="${CB.img}" style="width:120px;border-radius:10px;margin:8px 0">`:''}<br><b>Contiene:</b>${CB.items.map((x,i)=>`<div class=row><span>${q(x.q)} ${P(x.pid).unit} ${esc(P(x.pid).name)}</span><button class=x onclick="CB.items.splice(${i},1);draw()">✖</button></div>`).join('')}
<select id=ap style="margin-top:12px">${db.products.map(p=>`<option value=${p.id}>${esc(p.name)}`).join('')}</select><input id=aq inputmode=decimal placeholder="Cantidad"><button class="btn w" onclick="addI()">➕ Agregar al combo</button>
<div class=row><span>Costo</span><b>${g(c)}</b></div><div class=row><span>Precio de venta</span><b>${g(pr)}</b></div><div class=row><span>Ganancia</span><b class=ok>${g(pr-c)}</b></div></div><button class=btn onclick="saveC()">GUARDAR COMBO</button>${CB.id?'<button class="btn r" onclick="delC()">Eliminar combo</button>':''}`]},
vta:()=>{let tot=0;const step=k=>k[0]=='p'&&P(k.slice(2)).unit=='kg'?.5:1,
row=(k,e,n,pr,u,sub)=>{const v=CT[k]||0;tot+=v*pr;return`<div class=c style="${v?'border-color:var(--g2)':''}"><b>${e} ${esc(n)}</b> <small>${g(pr)}/${u}</small><br><small>${sub}</small><div class=qr><button onclick="cq('${k}',-1)">−</button><span onclick="cq('${k}',0)">${q(v)}</span><button onclick="cq('${k}',1)">+</button></div></div>`};
const h=db.products.map(p=>row('p:'+p.id,th(p),p.name,p.price,p.unit,'Hay '+q(st(p.id))+' '+p.unit)).join('')+db.combos.map(c=>row('c:'+c.id,th(c),c.name,c.price,'combo','Combo')).join('');
return['🧾 Nueva venta',`<button class="btn w" style="font-size:18px;padding:12px" onclick="go('hv')">📋 Ver ventas anteriores</button>${h}<div class=bar><div>TOTAL: <b>${g(tot)}</b></div><button class=btn onclick="doSale()" style="margin-top:8px">REGISTRAR VENTA</button></div>`]},
hv:()=>{let d='',h='';[...db.sales].sort((a,b)=>b.t-a.t).slice(0,60).forEach(s=>{const dd=day(s.t);if(dd!=d){d=dd;h+=`<h3>${d==T()?'Hoy':dmy(d)}</h3>`}
h+=`<details class=c><summary>${hm(s.t)} Venta — <b>${g(s.total)}</b></summary>${s.items.map(i=>`<div class=row><span>${q(i.q)} ${i.u} ${esc(i.n)}</span><b>${g(i.v)}</b></div>`).join('')}<button class="btn r" style="margin:10px 0 0;font-size:18px;padding:12px" onclick="anul('${s.id}')">Anular esta venta</button></details>`});
return['📋 Ventas',h||'<div class=c>Todavía no hay ventas.</div>']},
gas:()=>['💸 Gastos',`<div class=c><label>¿Qué gasto?</label><select id=gc><option>Bolsas<option>Combustible<option>Transporte<option>Publicidad<option>Otros</select><label>Monto (Gs.)</label><input id=ga inputmode=numeric placeholder="20000"><label>Fecha</label><input id=gd type=date value="${T()}"></div><button class=btn onclick="doGas()">GUARDAR GASTO</button>`+[...db.exp].sort((a,b)=>b.d<a.d?-1:1).slice(0,30).map(x=>`<div class=c><div class=row style="border:0"><span>${dmy(x.d)} — ${x.c}<br><b>${g(x.a)}</b></span><button class=x onclick="delGas('${x.id}')">✖</button></div></div>`).join('')],
res:a=>{const per=a.p||'hoy',r=sum(per),lw=db.products.filter(low);return['📊 Resumen',`<div class=grid><button class="btn ${per=='hoy'?'':'w'}" onclick="S[S.length-1].a={p:'hoy'};draw()">HOY</button><button class="btn ${per=='mes'?'':'w'}" onclick="S[S.length-1].a={p:'mes'};draw()">ESTE MES</button></div>
<div class=c><div class=row><span>Ventas</span><b>${g(r.v)}</b></div><div class=row><span>Costo mercadería</span><b>${g(r.c)}</b></div><div class="row tot"><span>Ganancia bruta</span><b>${g(r.gb)}</b></div><div class=row><span>Gastos</span><b>${g(r.e)}</b></div><div class="row tot ok"><span>Ganancia neta</span><b>${g(r.net)}</b></div><div class=row style="border:0"><small>Mercadería perdida o consumida</small><small>${g(r.lo)}</small></div></div>
<div class=c><b>Productos con stock bajo: ${lw.length}</b>${lw.map(p=>`<div>${th(p)}${esc(p.name)}: ${q(st(p.id))} ${p.unit}</div>`).join('')}</div>`]},

function cq(k,d){const s=k[0]=='p'&&P(k.slice(2)).unit=='kg'?.5:1;let v=CT[k]||0;if(d==0){const r=prompt('Cantidad',v||'');if(r===null)return;v=num(r)}else v+=d*s;CT[k]=Math.max(0,v);const y=scrollY;draw();scrollTo(0,y)}
function doSale(){const L=Object.keys(CT).filter(k=>CT[k]>0).map(key=>({key,q:CT[key]}));if(!L.length)return alert('Elegí al menos un producto');const N={};
L.forEach(l=>{const[k,i]=l.key.split(':');if(k=='p')N[i]=(N[i]||0)+l.q;else C(i).items.forEach(x=>N[x.pid]=(N[x.pid]||0)+x.q*l.q)});if(!ok(N))return;mkSale(L);CT={};toast('✅ Venta registrada');draw()}

function bg(el){const f=el.files[0];if(!f)return;const im=new Image();im.onload=()=>{BG=im;toast('✅ Foto lista')};im.src=URL.createObjectURL(f)}
function rp(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
const th=o=>o.img?`<img src="${o.img}" style="width:44px;height:44px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px">`:'',
LI=s=>new Promise(r=>{if(!s)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s}),
PER={kg:'el kg',unidad:'la unidad',cabeza:'la cabeza',atado:'el atado',docena:'la docena',mazo:'el mazo',bolsa:'la bolsa',caja:'la caja',cajón:'el cajón',otro:'c/u'};
function shrink(f,cb){const im=new Image();im.onload=()=>{const s=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.src=URL.createObjectURL(f)}
function pickP(el){const f=el.files[0];if(f)shrink(f,d=>{PI=d;$('#pv').innerHTML=`<img src="${d}" style="width:120px;border-radius:10px">`})}
function pickC(el){const f=el.files[0];if(f)shrink(f,d=>{CB.img=d;draw()})}
async function mk(){const sel=[...document.querySelectorAll('.pk:checked')].map(i=>i.value).slice(0,6);if(!sel.length)return alert('Elegí al menos un producto');
const it=await Promise.all(sel.map(async k=>{const[t,i]=k.split(':'),o=t=='p'?P(i):C(i);return{n:o.name.toUpperCase(),pr:g(o.price)+(t=='p'?' '+PER[o.unit]:''),im:await LI(o.img)}}));
const[w,h]={wa:[1080,1920],ig:[1080,1080],fb:[1200,630]}[$('#fm').value],m=Math.min(w,h),cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d'),F='-apple-system,Arial,sans-serif';
const fit=(t,wt,sz,mw)=>{let s=sz;x.font=`${wt} ${s}px ${F}`;while(x.measureText(t).width>mw&&s>10){s*=.93;x.font=`${wt} ${s}px ${F}`}},
pic=(im,a,b,z,r)=>{x.save();rp(x,a,b,z,z,r);x.clip();const s=Math.max(z/im.width,z/im.height);x.drawImage(im,a+(z-im.width*s)/2,b+(z-im.height*s)/2,im.width*s,im.height*s);x.restore()};
const gr=x.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#1b5e20');gr.addColorStop(1,'#7cb342');x.fillStyle=gr;x.fillRect(0,0,w,h);
if(BG){const s=Math.max(w/BG.width,h/BG.height);x.drawImage(BG,(w-BG.width*s)/2,(h-BG.height*s)/2,BG.width*s,BG.height*s);x.fillStyle='rgba(0,0,0,.5)';x.fillRect(0,0,w,h)}
x.textAlign='center';x.fillStyle='#fff';fit(db.biz.name,800,m*.085,w*.9);x.fillText(db.biz.name,w/2,m*.11);x.fillStyle='#ffeb3b';fit($('#hd').value,800,m*.06,w*.9);x.fillText($('#hd').value,w/2,m*.2);
const T0=m*.26,A=h-T0-m*.17,n=it.length;
if(n==1){const i=it[0],ph=i.im?Math.min(A*.52,w*.8):0;if(i.im)pic(i.im,(w-ph)/2,T0,ph,m*.04);const ny=i.im?T0+ph+m*.11:T0+A*.38;
x.fillStyle='#fff';fit(i.n,800,m*.095,w*.9);x.fillText(i.n,w/2,ny);x.fillStyle='#ffeb3b';fit(i.pr,900,m*.14,w*.92);x.fillText(i.pr,w/2,ny+m*(i.im?.15:.2))}
else{const rh=Math.min(A/n,m*(n<=3?.3:.2)),y0=T0+(A-rh*n)/2;it.forEach((i,k)=>{const y=y0+k*rh,ox=m*.09+(i.im?rh*.9:0),mw=w-m*.09-ox;x.fillStyle='rgba(255,255,255,.96)';rp(x,m*.05,y+rh*.06,w-m*.1,rh*.88,rh*.2);x.fill();
if(i.im)pic(i.im,m*.08,y+rh*.1,rh*.8,rh*.12);x.textAlign='left';x.fillStyle='#14341a';fit(i.n,800,rh*.28,mw);x.fillText(i.n,ox,y+rh*.46);x.fillStyle='#c62828';fit(i.pr,800,rh*.32,mw);x.fillText(i.pr,ox,y+rh*.82)})}
x.textAlign='center';x.fillStyle='#fff';fit(db.biz.wa?'Pedidos por WhatsApp: '+db.biz.wa:'Pedidos por WhatsApp',700,m*.05,w*.92);x.fillText(db.biz.wa?'Pedidos por WhatsApp: '+db.biz.wa:'Pedidos por WhatsApp',w/2,h-m*.06);
CV=cv;const url=cv.toDataURL('image/png');$('#out').innerHTML=`<img src="${url}" style="width:100%;border-radius:12px;margin-bottom:12px"><button class=btn onclick="shr()">📤 COMPARTIR</button><a class="btn w" download="publicacion.png" href="${url}">⬇️ DESCARGAR</a><small>Si no baja, mantené apretada la imagen y tocá "Guardar".</small>`}
function shr(){CV.toBlob(b=>{const f=new File([b],'publicacion.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else alert('Mantené apretada la imagen y elegí Guardar')})}
function saveB(){db.biz={name:$('#bn').value.trim()||'Mi Verdulería',wa:$('#bw').value.trim(),mk:num($('#bk').value)||40,round:+$('#br').value||500};reprice();save();toast('✅ Guardado');back()}
function dl(name,txt,type){const b=new Blob([txt],{type}),f=new File([b],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}}
function exp(){dl('verduleria-'+T()+'.json',JSON.stringify(db),'application/json')}
function expC(){const r=['Fecha;Hora;Detalle;Total;Costo;Ganancia'];db.sales.forEach(s=>r.push([dmy(day(s.t)),hm(s.t),'"'+s.items.map(i=>q(i.q)+' '+i.u+' '+i.n).join(', ')+'"',Math.round(s.total),Math.round(s.cost),Math.round(s.total-s.cost)].join(';')));dl('ventas-'+T()+'.csv','\uFEFF'+r.join('\n'),'text/csv')}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.moves)throw 0;if(!confirm('Esto reemplaza todos los datos actuales. ¿Seguir?'))return;db=Object.assign({products:[],combos:[],moves:[],sales:[],exp:[],biz:{name:'Mi Verdulería',wa:'',mk:40,round:500}},d);save();S.length=1;draw();toast('✅ Datos importados')}catch(e){alert('Ese archivo no es una copia válida.')}};r.readAsText(f)}
(function(){const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#1b5e20';x.fillRect(0,0,180,180);x.font='110px serif';x.textAlign='center';x.fillText('🥬',90,128);$('#ati').href=c.toDataURL()})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
draw();
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,setDoc,writeBatch} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {firebaseConfig as cfg} from './config.js';
const COLS=['products','combos','moves','sales','exp'],sh={products:{},combos:{},moves:{},sales:{},exp:{}},code=localStorage.getItem('verdu_code'),sy=t=>{$('#sy').textContent=t},LIVE=['home','stock','prod','prec','vta','hv','res'];
let shBiz='',fs,live=false;
const col=c=>collection(fs,'profiles',code,c),dc=(c,i)=>doc(fs,'profiles',code,c,i),refresh=()=>{if(LIVE.includes(S[S.length-1].v))draw()};
if(!cfg.apiKey||cfg.apiKey.startsWith('PEGAR'))sy('☁️ sin nube');
else if(!code)sy('☁️ falta código');
else{try{const app=initializeApp(cfg);try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){fs=initializeFirestore(app,{})}sy('☁️ conectando…');start()}catch(e){console.error(e);sy('⚠️ sin nube')}}
function bizFrom(s){const b=s.docs.find(d=>d.id=='biz');if(b){db.biz=Object.assign({name:'Mi Verdulería',wa:'',mk:40,round:500},b.data());shBiz=JSON.stringify(db.biz)}}
function status(snaps){const p=[...COLS,'cfg'].some(c=>snaps[c]&&snaps[c].metadata.hasPendingWrites);sy(p?'⏳ guardando…':'☁️ al día')}
function start(){const snaps={},seen={};
[...COLS,'cfg'].forEach(c=>onSnapshot(col(c),s=>{snaps[c]=s;
if(!live){if(c=='cfg'&&s.metadata.fromCache&&!s.docs.some(d=>d.id=='meta'))return;seen[c]=1;if(Object.keys(seen).length==6)first(snaps)}
else apply(c,s);if(live)status(snaps)},e=>{console.error(e);sy('⚠️ error de nube')}))}
function first(snaps){const cloudHas=snaps.cfg.docs.some(d=>d.id=='meta'),localHas=db.moves.length||db.sales.length||db.exp.length||db.combos.length||db.products.length>7;
const fromCloud=()=>{COLS.forEach(c=>apply(c,snaps[c],1));bizFrom(snaps.cfg)},mark=()=>{COLS.forEach(c=>{sh[c]={};snaps[c].docs.forEach(d=>sh[c][d.id]=JSON.stringify(d.data()))});const b=snaps.cfg.docs.find(d=>d.id=='biz');shBiz=b?JSON.stringify(b.data()):''};
if(!cloudHas){mark();live=true;setDoc(dc('cfg','meta'),{at:Date.now()});cloudSave()}
else if(localHas&&localStorage.getItem('verdu_synced')!=code){
 if(confirm('Este celular tiene datos propios y la nube también.\n\nAceptar = usar los datos de la NUBE (se pierden los de este celular)\nCancelar = SUBIR los de este celular (reemplazan a los de la nube)')){localStorage.setItem('verdu_backup',JSON.stringify(db));fromCloud();live=true}
 else{mark();live=true;cloudSave()}}
else{fromCloud();live=true}
localStorage.setItem('verdu_synced',code);localStore();refresh();status(snaps)}
function apply(c,s,quiet){if(c=='cfg')bizFrom(s);else{db[c]=s.docs.map(d=>d.data());sh[c]={};db[c].forEach(x=>sh[c][x.id]=JSON.stringify(x));if(c=='products')db.products.sort(srt)}if(!quiet){localStore();refresh()}}
window.cloudSave=()=>{if(!live)return;const ops=[];COLS.forEach(c=>{const cur={};db[c].forEach(x=>cur[x.id]=JSON.stringify(x));
for(const i in cur)if(sh[c][i]!==cur[i]){ops.push([c,i,JSON.parse(cur[i])]);sh[c][i]=cur[i]}
for(const i in sh[c])if(!(i in cur)){ops.push([c,i,null]);delete sh[c][i]}});
const b=JSON.stringify(db.biz);if(b!==shBiz){ops.push(['cfg','biz',JSON.parse(b)]);shBiz=b}
for(let k=0;k<ops.length;k+=400){const w=writeBatch(fs);ops.slice(k,k+400).forEach(([c,i,v])=>v?w.set(dc(c,i),v):w.delete(dc(c,i)));w.commit().catch(e=>{console.error(e);sy('⚠️ error de nube')})}};
</script>
